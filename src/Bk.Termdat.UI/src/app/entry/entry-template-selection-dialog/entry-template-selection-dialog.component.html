<h1 mat-dialog-title>
    {{ 'entry.template.applyTitle' | translate }}
    <button [mat-dialog-close] mat-icon-button [attr.aria-label]="'common.close' | translate">
        <mat-icon svgIcon="xmark" class="ob-icon" />
    </button>
</h1>

<mat-dialog-content class="dialog-content">
    <form [formGroup]="templateSelectionForm">
        <mat-form-field>
            <mat-select formControlName="entryTemplateId">
                @for (entryTemplate of entryTemplates; track entryTemplate.id) {
                    <mat-option [value]="entryTemplate.id">{{ entryTemplate.templateName }}</mat-option>
                }
            </mat-select>
        </mat-form-field>
    </form>
</mat-dialog-content>

<div mat-dialog-actions class="dialog-buttons-right">
    <button [mat-dialog-close] color="primary" mat-stroked-button>
        {{ 'common.cancel' | translate }}
    </button>
    <button (click)="selectTemplate()" color="primary" mat-flat-button>
        {{ 'entry.template.apply.confirmButton' | translate }}
    </button>
</div>
