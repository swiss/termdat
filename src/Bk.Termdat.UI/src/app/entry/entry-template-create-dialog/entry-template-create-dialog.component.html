<h1 mat-dialog-title>
    {{ 'entry.template.createTitle' | translate }}
    <button mat-dialog-close mat-icon-button [attr.aria-label]="'common.close' | translate">
        <mat-icon svgIcon="xmark" class="ob-icon" />
    </button>
</h1>
<mat-dialog-content class="dialog-content">
    <form [formGroup]="templateForm">
        <mat-form-field>
            <mat-label>{{ 'entry.template.createText' | translate }}</mat-label>
            <input matInput type="text" formControlName="name" required />
            @for (error of templateForm.controls.name.errors | keyvalue; track error.key) {
                <mat-error>
                    {{ 'i18n.validation.' + error.key | translate: error.value }}
                </mat-error>
            }
        </mat-form-field>
    </form>
</mat-dialog-content>

<div mat-dialog-actions class="dialog-buttons-right">
    <button mat-dialog-close color="primary" mat-stroked-button>
        {{ 'common.cancel' | translate }}
    </button>
    <button (click)="createTemplate()" color="primary" mat-flat-button>
        {{ 'entry.template.create.confirmButton' | translate }}
    </button>
</div>
