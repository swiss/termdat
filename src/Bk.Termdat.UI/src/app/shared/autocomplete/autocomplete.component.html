<mat-form-field>
    <mat-label><ng-content select="mat-label" /></mat-label>

    <input
        type="text"
        matInput
        [formControl]="input"
        [matAutocomplete]="auto"
        (change)="onInputChange()"
        [errorStateMatcher]="errorStateMatcher"
        (blur)="onTouched()"
    />

    <button type="button" role="button" [obInputClear]="input" (onClear)="clear()">
        <mat-icon svgIcon="xmark_circle" class="ob-icon" />
    </button>

    <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selectItem($event)" [displayWith]="getDisplayFn()">
        @for (option of filteredOptions$ | async; track option.id) {
            <mat-option [value]="option.id" [disabled]="!!option.disabled" [ngClass]="{'multi-line': disableAutocompleteEllipsis}">
                {{ getOptionDisplay(option) }}
            </mat-option>
        }
    </mat-autocomplete>

    <mat-error><ng-content select="mat-error" /></mat-error>
</mat-form-field>
