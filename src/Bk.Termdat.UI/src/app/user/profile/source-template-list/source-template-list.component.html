<mat-expansion-panel>
    <mat-expansion-panel-header>
        <mat-panel-title>
            <h5>{{ 'profile.sourceTemplates' | translate }}</h5>
        </mat-panel-title>
    </mat-expansion-panel-header>
    <div class="default-table">
        <table mat-table [dataSource]="dataSource" matSort class="ob-table ob-table-sm ob-table-collapse-md sort-table">
            <!-- Id Column -->
            <ng-container matColumnDef="displayText">
                <th mat-header-cell *matHeaderCellDef mat-sort-header matTooltip="{{ 'field.text' | translate }}" matTooltipPosition="above" scope="col">
                    {{ 'field.text' | translate }}
                </th>
                <td mat-cell *matCellDef="let row" [attr.data-title]="'field.text' | translate">{{ row.displayText }}</td>
            </ng-container>
            <ng-container matColumnDef="action">
                <th mat-header-cell *matHeaderCellDef matTooltip="{{ 'sourceTemplate.action' | translate }}" matTooltipPosition="above" scope="col">
                    {{ 'sourceTemplate.action' | translate }}
                </th>
                <td mat-cell *matCellDef="let row" [attr.data-title]="'administration.action' | translate" class="no-break">
                    <td-source-template-form (update)="update($event)" (delete)="delete($event)" [updateMode]="true" [sourceTemplate]="row" />
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
    </div>

    <br />
    <td-source-template-form (create)="create($event)" />
</mat-expansion-panel>
